services:  
  db:
    image: mysql:8.3   
    environment:             
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: django-db
      MYSQL_USER: django
      MYSQL_PASSWORD: django
      TZ: 'Asia/Tokyo'
    command: mysqld --character-set-server=utf8 --collation-server=utf8_unicode_ci
    ports:
      - "3306:3306"        
  web:
    build: 
      # ビルドコンテナはカレントディレクトリ
      context: .
      dockerfile: dockerfiles/django/Dockerfile
    # 静的ファイル収集、gunicorn起動 gunicornの設定を適応
    command: >
      sh -c "
      python manage.py collectstatic --noinput &&
      gunicorn djangopj.wsgi:application --config /code/dockerfiles/django/gunicorn_config.py"
    environment:
      TZ: Asia/Tokyo
    env_file:
      - .env
    # 静的ファイルをwebとnginxコンテナで共有
    volumes:
      - static_volume:/code/staticfiles
    # コンテナ内でポート番号8000使用を宣言
    expose:
      - "8000"

  nginx:
    build:
      context: .
      dockerfile: dockerfiles/nginx/Dockerfile
    image: b-team_nginx
    environment:
      TZ: Asia/Tokyo
    ports:
      - 80:80
    # 静的ファイルをwebとnginxコンテナで共有
    volumes:
      - static_volume:/code/staticfiles
    depends_on:
      - web

# コンテナ間で静的ファイルを共有する
volumes:
  static_volume: