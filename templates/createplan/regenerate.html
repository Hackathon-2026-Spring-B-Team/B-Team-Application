{% extends 'createplan/base.html' %}

{% block title %}プラン再生成{% endblock %}

{% block content %}

<form action="" method="POST" class="flex-1 flex flex-col">

    {% csrf_token %}

    <!-- 画面上部説明-->
    <div class="p-8 text-white flex-col justify-center">
        <h1 class="text-2xl font-bold mb-6">再生成</h1>
        <div>さらに細かく調整したい部分を<br>あなたの言葉で教えてください</div>
    </div>
    
    <!-- 画面下部フォームカード -->
    <div class="bg-white p-8 space-y-4 rounded-t-3xl flex-1 flex flex-col justify-center">
        <textarea name="feedback" class="w-full p-4 border rounded-xl h-40 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="例：計算問題をもっと増やしたい"></textarea>
        
        <!-- ボタン -->
        <button type="submit" class="w-full bg-[#116329] text-white py-4 rounded-xl font-bold mt-8">
            再生成
        </button>
    </div>
</form>

{% endblock %}
