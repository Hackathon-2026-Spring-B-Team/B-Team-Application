{% extends 'createplan/base.html' %}

{% load static %}

{% block title %}情報入力{% endblock %}

{% block content %}
<!-- URLの設定お願いします -->
<form action="{% url 'request_ai_api' %}" method="POST" class="contents" id="plan-form">
  {% csrf_token %}

  <!-- 画面上部説明 -->
  <div class="h-[30vh] p-8 pb-4 text-white flex flex-col items-center justify-center shrink-0">

    <!-- ロゴ -->
    <div class="w-1/4 mb-4">
      <img src="{% static 'images/logo_white.png' %}" alt="METIS Logo" class="w-full h-auto">
    </div>
    
    <!-- 説明 -->
    <h1 class="text-2xl font-bold mb-3">情報入力</h1>
    <div class="text-center leading-relaxed text-gray-100 text-sm">
        試験や資格の情報を入力してください<br>
        あなたを合格に導くプランを作成します
    </div>

  </div>

  <!-- 画面下部カード　-->
  <div class="bg-white p-6 pt-8 rounded-t-3xl flex-1 flex flex-col overflow-hidden shadow-lg">
      
    <!-- フォーム入力部分 -->
    <div class="flex-1 overflow-y-auto space-y-6 px-1 pb-4">
        
        <div>
            <label class="block text-sm font-bold text-gray-800 mb-2">資格名</label>
            <input type="text" name="license_name" class="w-full p-4 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-green-600 focus:bg-white transition-colors text-sm">
        </div>
        
        <div>
            <label class="block text-sm font-bold text-gray-800 mb-2">受験予定日</label>
            <input type="date" name="test_date" class="w-full p-4 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-green-600 focus:bg-white transition-colors text-sm">
        </div>
        
        <div>
            <label class="block text-sm font-bold text-gray-800 mb-2">1日の勉強時間目安（時間）</label>
            <input type="number" name="study_hours" class="w-full p-4 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-green-600 focus:bg-white transition-colors text-sm">
        </div>

    </div>

    <!-- ボタン部分 -->
    <div class="shrink-0 pt-4 pb-2 w-full">
        <button type="submit" class="w-full bg-green-600 active:bg-green-700 transition-colors text-white py-4 rounded-xl font-bold text-center text-sm shadow-md">
            学習プラン生成
        </button>
    </div>

  </div>
</form>

<!-- Loading Overlay -->
<div id="loading-overlay"
     class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center">

    <div class="bg-white p-8 rounded-2xl flex flex-col items-center shadow-lg">
        <!-- spinner -->
        <div class="w-12 h-12 border-4 border-gray-300 border-t-[#116329] rounded-full animate-spin"></div>

        <p class="mt-4 text-gray-700 font-medium">
            学習プランを生成中...
        </p>
        <p class="text-sm text-gray-500 mt-1">
            少々お待ちください
        </p>
    </div>
</div>

<script>
document.getElementById('plan-form').addEventListener('submit', function() {
    document.getElementById('loading-overlay').classList.remove('hidden');
});
</script>
{% endblock %}
