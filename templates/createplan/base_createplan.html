<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <title>{% block title %}{% endblock %} | AIロードマップ</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      /* カルーセルのスクロールバーを非表示にする（デザイン重視） */
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
  </head>
  <body class="bg-gray-50 text-gray-900 font-sans min-h-screen bg-gradient-to-tr from-[#116329] to-[#002d11]">
    <main class="max-w-md mx-auto min-h-screen flex flex-col">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
